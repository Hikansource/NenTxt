<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font: 14px system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f5f7;
    color: #1c2430;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1216; color: #e7ebf0; }
  }
  form {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  textarea {
    width: 100%;
    min-height: 80px;
    resize: vertical;
    font: inherit;
    color: inherit;
    background: rgba(128,128,128,.08);
    border: 1px solid rgba(128,128,128,.35);
    border-radius: 8px;
    padding: 8px 10px;
  }
  textarea:focus { outline: 2px solid #5865f2; border-color: #5865f2; }
  .bar { display: flex; align-items: center; gap: 10px; }
  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: #5865f2;
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  #msg { font-size: 12px; min-height: 1.2em; opacity: .85; }
  #msg.ok { color: #2f9e5e; }
  #msg.err { color: #d64545; }
</style>
</head>
<body>
  <form id="f">
    <textarea id="t" placeholder="Type a message…" autofocus></textarea>
    <div class="bar">
      <button id="b" type="submit">Send</button>
      <span id="msg"></span>
    </div>
  </form>
<script>
  var WEBHOOK = "https://discord.com/api/webhooks/1569788181560299550/7K-aY-G-2c8gmpZhyGAqwbqeURd_j2UWBGDcQdSnazMeVqU-fQsI5CODHmjrtNoIOBv4";
  var f = document.getElementById("f"), t = document.getElementById("t"),
      b = document.getElementById("b"), m = document.getElementById("msg");
  function say(text, cls) { m.textContent = text; m.className = cls || ""; }
  async function send() {
    var c = t.value.trim();
    if (!c) { say("Type something first.", "err"); return; }
    if (c.length > 2000) { say("Max 2000 characters.", "err"); return; }
    b.disabled = true; say("Sending…");
    try {
      var r = await fetch(WEBHOOK, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: c })
      });
      if (r.ok || r.status === 204) { t.value = ""; say("Sent.", "ok"); t.focus(); }
      else { say("Rejected (" + r.status + ")", "err"); }
    } catch (e) { say("Couldn't reach Discord.", "err"); }
    finally { b.disabled = false; }
  }
  f.addEventListener("submit", function (e) { e.preventDefault(); send(); });
  t.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
</script>
</body>
</html>
